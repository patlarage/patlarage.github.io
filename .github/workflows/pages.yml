name: Pages Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          A894CB: ${{ secrets.A894CB }}
          BD9F0C: ${{ secrets.BD9F0C }}
        run: |
          python3 -c "
          import os, pathlib, sys
          k1 = os.environ.get('A894CB', '')
          k2 = os.environ.get('BD9F0C', '')
          idx = pathlib.Path('index.html')
          txt = idx.read_text(encoding='utf-8')
          out = txt.replace('<!-- c6f7bcef507b58d0227f7c101f4ec2011c1f -->', k1) if k1 else txt
          out = out.replace('<!-- 353833abcf5812acbbd067c65a211eb4a4fc0ff2c00e -->', k2) if k2 else out
          if out == txt and (k1 or k2):
              sys.exit(1)
          if out != txt:
              idx.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
